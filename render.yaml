services:
  - type: web
    name: project-vishwa-ai
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn main:app --workers 1 --threads 4 --timeout 90
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: AI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: AI_MODEL
        value: openai/gpt-oss-20b
      - key: FLASK_SECRET_KEY
        generateValue: true
